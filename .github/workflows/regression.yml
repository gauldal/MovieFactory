name: regression

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  regression-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install engine requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_engine.txt

      - name: Run regression check (CI-identical)
        run: |
          python -m moviefactory.eval.regression_check moviefactory/eval/text_queries_intent.yaml
