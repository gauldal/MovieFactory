name: regression

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  regression-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies (engine)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements_engine.txt") {
            pip install -r requirements_engine.txt
          } else {
            Write-Host "requirements_engine.txt not found. Please add it or adjust this step."
            exit 1
          }

      # ✅ 로컬과 100% 동일: check_regression.bat 더블클릭 == CI에서 bat 실행
      - name: Run one-click regression (same as local)
        shell: cmd
        run: |
          call check_regression.bat
