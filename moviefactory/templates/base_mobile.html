<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MovieFactory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- cache bust: 필요하면 뒤에 ?v=1 붙여도 됨 -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>
<body>

<!-- =========================
     MOBILE HEADER
========================= -->
<header class="m-header">
  <div class="m-header-inner">

    <!-- Hamburger -->
    <button class="m-menu-btn" id="gm-open" type="button" aria-label="Open menu">☰</button>

    <!-- Logo -->
    <a href="/" class="m-logo">MovieFactory</a>

    <!-- Icons -->
    <div class="m-icons">
      <a href="#" aria-label="Profile">👤</a>
    </div>

  </div>
</header>

<!-- =========================
     GLOBAL SEARCH (MOBILE)
     TEXT = GET / IMAGE = POST (auto submit)
========================= -->
<form
  class="m-search m-search-global"
  action="/search"
  method="get"
>

  <!-- TEXT SEARCH -->
  <input
    class="m-search-input"
    type="text"
    name="q"
    placeholder="Search for movies..."
    autocomplete="off"
  >

  <!-- IMAGE UPLOAD (CLIP) -->
  <input
    type="file"
    name="image"
    accept="image/*"
    id="m-image-input"
    hidden
  >

  <!-- PHOTO BUTTON -->
  <button
    type="button"
    class="m-photo-btn"
    id="m-photo-btn"
  >
    Photo
  </button>

</form>

<!-- =========================
     GENRE SLIDE PANEL
========================= -->
<div id="genre-overlay" class="gm-overlay" aria-hidden="true"></div>

<aside id="genre-panel" class="gm-panel" aria-label="Genre panel">
  <div class="gm-header">
    <span>Genres</span>
    <button
      id="gm-close"
      type="button"
      aria-label="Close menu"
      class="gm-close-btn"
    >✕</button>
  </div>

  <nav class="gm-list">
    {% for g in ["Action","Adventure","Animation","Comedy","Crime","Drama","Fantasy","Horror","Romance","SF","Thriller","War"] %}
      <a href="/search?genre={{ g }}">{{ g }}</a>
    {% endfor %}
  </nav>
</aside>

<!-- =========================
     MAIN CONTENT
========================= -->
<main class="m-main">
  {% block content %}{% endblock %}
</main>

<!-- =========================
     BOTTOM NAV
========================= -->
<nav class="m-bottom-nav">
  <a href="/">Home</a>
  <a href="#" onclick="document.querySelector('.m-search-input')?.focus(); return false;">Search</a>
  <a href="#">Favorites</a>
  <a href="#">Profile</a>
</nav>

<!-- =========================
     JS
========================= -->
<script src="{{ url_for('static', filename='js/mobile.js') }}"></script>

<script>
  // Photo 버튼 → 파일 선택창
  document.getElementById("m-photo-btn")?.addEventListener("click", function () {
    document.getElementById("m-image-input")?.click();
  });

  // 이미지 선택되면: POST로 전환 후 제출
  document.getElementById("m-image-input")?.addEventListener("change", function () {
    if (this.files && this.files.length > 0) {
      const form = document.querySelector(".m-search-global");
      if (!form) return;

      form.method = "post";
      form.enctype = "multipart/form-data";
      form.submit();
    }
  });
</script>

</body>
</html>
