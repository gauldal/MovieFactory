version: "3.9"

# ============================================================
# MovieFactory Docker Compose
#
# 목적:
# - Flask Web UI / API
# - Streamlit Analytics Dashboard
# 를 서로 독립된 컨테이너로 실행
#
# 설계 원칙:
# - 서비스 로직과 시각화 로직 분리
# - 동일 project_root 기준 데이터/캐시 공유
# - CPU 기본, GPU는 선택 확장
# ============================================================

services:

  # ------------------------------------------------------------
  # Flask Web UI + API Service
  # ------------------------------------------------------------
  flask:
    container_name: moviefactory-flask
    build:
      context: .
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    volumes:
      # project_root 전체 공유
      - ./:/app
    environment:
      # Streamlit Dashboard 접근 URL (환경 분기 가능)
      - STREAMLIT_URL=http://streamlit:8501
    depends_on:
      - streamlit
    restart: unless-stopped

  # ------------------------------------------------------------
  # Streamlit Analytics Dashboard
  # ------------------------------------------------------------
  streamlit:
    container_name: moviefactory-streamlit
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      # 동일 project_root 공유 (data / .cache 접근)
      - ./:/app
    restart: unless-stopped

# ------------------------------------------------------------
# GPU 확장 관련 안내
# ------------------------------------------------------------
# - GPU 환경이 필요한 경우:
#   Dockerfile.gpu 기반 이미지 사용
# - v1 기본 compose에서는 GPU를 사용하지 않음
# - GPU는 v2 확장 시 선택적으로 활성화
#
# (GPU 서비스는 의도적으로 기본 compose에서 제외)
# ------------------------------------------------------------
